services:
  - type: web
    name: atem-field-backend
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    maxShutdownDelaySeconds: 120
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: PUBLIC_APP_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ENCRYPTION_MASTER_KEY
        sync: false
      - key: BCRYPT_SALT_ROUNDS
        value: 12
      - key: TECHNICIAN_PORTAL_SECRET
        sync: false
      - key: TECHNICIAN_PORTAL_LINK_TTL_HOURS
        value: 72
      - key: OS_SUPABASE_URL
        sync: false
      - key: OS_SUPABASE_ANON_KEY
        sync: false
      - key: OS_BACKEND_URL
        sync: false
      - key: GOOGLE_CALENDAR_SYNC_ENABLED
        value: false
